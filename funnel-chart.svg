<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- card -->
  <rect x="10" y="10" width="840" height="520" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <!-- title -->
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0b0b0b">Where shoppers drop off, and why</text>
  <text x="40" y="76" font-size="14" fill="#52514e">RetailRocket online store &#183; 1.4M visitors &#183; May to Sep 2015</text>

  <!-- ===================== Panel A: funnel ===================== -->
  <text x="40" y="116" font-size="15" font-weight="700" fill="#0b0b0b">The funnel: only 2.7% of visitors ever add to cart</text>

  <!-- Row 1: Viewers -->
  <text x="210" y="157" font-size="13" fill="#52514e" text-anchor="end">Viewers</text>
  <rect x="225" y="140" width="560" height="24" rx="4" fill="#2a78d6"/>
  <text x="237" y="157" font-size="13" font-weight="600" fill="#ffffff">1,404,179 &#160;&#160;(100%)</text>

  <!-- Row 2: Added to cart -->
  <text x="210" y="197" font-size="13" fill="#52514e" text-anchor="end">Added to cart</text>
  <rect x="225" y="180" width="15" height="24" rx="3" fill="#2a78d6"/>
  <text x="250" y="197" font-size="13" fill="#0b0b0b">37,722 &#160;&#160;(2.7% of viewers)</text>

  <!-- Row 3: Bought -->
  <text x="210" y="237" font-size="13" fill="#52514e" text-anchor="end">Bought</text>
  <rect x="225" y="220" width="6" height="24" rx="2" fill="#2a78d6"/>
  <text x="241" y="237" font-size="13" fill="#0b0b0b">11,719 &#160;&#160;(0.83%)</text>

  <text x="225" y="270" font-size="12" fill="#898781">Once something is in the cart, 31% go on to buy. Checkout is fine, discovery is the leak.</text>

  <!-- divider -->
  <line x1="40" y1="292" x2="820" y2="292" stroke="#e1e0d9"/>

  <!-- ===================== Panel B: browsing depth ===================== -->
  <text x="40" y="326" font-size="15" font-weight="700" fill="#0b0b0b">Why: 80% view a single item, then leave</text>

  <!-- Row 1: 1 item -->
  <text x="210" y="365" font-size="13" fill="#52514e" text-anchor="end">1 item</text>
  <rect x="225" y="348" width="448" height="24" rx="4" fill="#eb6834"/>
  <text x="683" y="365" font-size="13" font-weight="700" fill="#0b0b0b">80% &#160;(1,118,109)</text>

  <!-- Row 2: 2-4 items -->
  <text x="210" y="401" font-size="13" fill="#52514e" text-anchor="end">2-4 items</text>
  <rect x="225" y="384" width="101" height="24" rx="4" fill="#2a78d6"/>
  <text x="336" y="401" font-size="13" fill="#0b0b0b">18%</text>

  <!-- Row 3: 5-9 items -->
  <text x="210" y="437" font-size="13" fill="#52514e" text-anchor="end">5-9 items</text>
  <rect x="225" y="420" width="12" height="24" rx="3" fill="#2a78d6"/>
  <text x="247" y="437" font-size="13" fill="#0b0b0b">2%</text>

  <!-- Row 4: 10+ items -->
  <text x="210" y="473" font-size="13" fill="#52514e" text-anchor="end">10+ items</text>
  <rect x="225" y="456" width="5" height="24" rx="2" fill="#2a78d6"/>
  <text x="240" y="473" font-size="13" fill="#0b0b0b">0.7%</text>

  <text x="225" y="506" font-size="12" fill="#898781">Buyers view about 10 items each. Non-buyers view about 1.5. The lever is product discovery.</text>
</svg>
